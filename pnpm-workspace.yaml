packages:
  - 'apps/*'
  - 'packages/*'
overrides:
  '@tanstack/react-query': '^5.0.0'
  'react': '19.2.3'
  'react-dom': '19.2.3'
  'react-native-reanimated': '4.5.1'
  'react-native-worklets': '0.10.1'
peerDependencyRules:
  allowedVersions:
    '@tanstack/react-query': '^5.0.0'
    'react': '19.2.3'
    'react-dom': '19.2.3'
allowBuilds:
  '@scarf/scarf': true
  bufferutil: true
  core-js: true
  es5-ext: true
  esbuild: true
  utf-8-validate: true
minimumReleaseAgeExclude:
  - expo-background-fetch@57.0.17
  - expo-task-manager@57.0.17 || 57.0.20
  - unimodules-app-loader@57.0.2
  - expo-haptics@57.0.3
  - expo-network@57.0.2
  - expo-image-picker@57.0.19 || 57.0.20
  - '@expo/cli@57.0.27'
  - '@expo/router-server@57.0.11'
  - babel-preset-expo@57.0.13
  - expo-modules-core@57.0.19
  - expo-modules-jsi@57.1.1
  - expo@57.0.25
  - '@expo/ui@57.0.20'
  - expo-auth-session@57.0.13
  - expo-background-task@57.0.20
  - expo-glass-effect@57.0.4
  - expo-linking@57.0.11
  - expo-notifications@57.0.21
  - expo-router@57.0.23
  - expo-sharing@57.0.22
  - expo-video@57.0.5
