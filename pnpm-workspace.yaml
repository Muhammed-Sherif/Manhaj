packages:
  - 'apps/*'
  - 'packages/*'
overrides:
  '@tanstack/react-query': '^5.0.0'
  'react': '19.2.3'
  'react-dom': '19.2.3'
  'react-native-reanimated': '4.5.1'
  'react-native-worklets': '0.10.1'
peerDependencyRules:
  allowedVersions:
    '@tanstack/react-query': '^5.0.0'
    'react': '19.2.3'
    'react-dom': '19.2.3'
allowBuilds:
  '@scarf/scarf': true
  bufferutil: true
  core-js: true
  es5-ext: true
  esbuild: true
  utf-8-validate: true
minimumReleaseAgeExclude:
  - expo-background-fetch@57.0.17
  - expo-task-manager@57.0.17
  - unimodules-app-loader@57.0.2
  - expo-haptics@57.0.3
  - expo-network@57.0.2
